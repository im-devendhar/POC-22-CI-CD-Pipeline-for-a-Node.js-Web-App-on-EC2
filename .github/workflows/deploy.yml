name: Build → Push → Deploy (self-hosted EC2)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
  CONTAINER_NAME: webapp
  HOST_PORT: 80
  APP_PORT: 3000

jobs:
  deploy:
    runs-on: self-hosted   # Runs directly on your EC2 runner
    steps:

      # 1) Checkout code from repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Login to Docker Hub
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3) Build image (node-app)
      - name: Build image
        run: |
          docker build -t $IMAGE:latest .

      # 4) Push image to Docker Hub (:latest)
      - name: Push image (:latest)
        run: |
          docker push $IMAGE:latest

      # 5) Deploy Locally on EC2 using latest image
      - name: Deploy locally (stop old → run new → health check)
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE }}"
          NAME="${{ env.CONTAINER_NAME }}"
          NEW_IMAGE="$IMAGE:latest"

          echo "Pulling latest image..."
          docker pull "$NEW_IMAGE"

          echo "Stopping old container..."
          docker rm -f "$NAME" || true

          echo "Starting new container..."
          docker run -d --name "$NAME" -p ${{ env.HOST_PORT }}:${{ env.APP_PORT }} \
            -e NODE_ENV=production \
            "$NEW_IMAGE"

          echo "Health checking..."
          for i in {1..12}; do
            sleep 2
            if curl -fsS http://localhost/health || curl -fsS http://localhost; then
              echo "Health check passed"
              exit 0
            fi
          done

          echo "Health check FAILED"
          docker logs "$NAME" || true
          exit 1
